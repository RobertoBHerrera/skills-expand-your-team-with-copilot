name: Add New Activity
description: Request a new extracurricular activity to be added to the Mergington High School system.
title: "Add activity: [Activity Name]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request a new extracurricular activity. Please fill in all required fields so this request can be implemented without needing further clarification.

  - type: input
    id: activity-name
    attributes:
      label: Activity Name
      description: The full name of the activity as it should appear on the website.
      placeholder: "e.g., Photography Club"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Activity Description
      description: A short description of the activity that students will see on the website.
      placeholder: "e.g., Explore photography techniques, learn about composition, and showcase your work in our annual gallery."
    validations:
      required: true

  - type: input
    id: schedule
    attributes:
      label: Schedule (human-readable)
      description: The schedule as it should appear on the activity card.
      placeholder: "e.g., Tuesdays and Thursdays, 3:30 PM - 5:00 PM"
    validations:
      required: true

  - type: dropdown
    id: days
    attributes:
      label: Days of the Week
      description: Select all days when this activity meets.
      multiple: true
      options:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
    validations:
      required: true

  - type: input
    id: start-time
    attributes:
      label: Start Time (24-hour format)
      description: Start time in HH:MM format (24-hour clock).
      placeholder: "e.g., 15:30"
    validations:
      required: true

  - type: input
    id: end-time
    attributes:
      label: End Time (24-hour format)
      description: End time in HH:MM format (24-hour clock).
      placeholder: "e.g., 17:00"
    validations:
      required: true

  - type: input
    id: max-participants
    attributes:
      label: Maximum Number of Participants
      description: The maximum number of students allowed to sign up for this activity.
      placeholder: "e.g., 20"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this request has been completed successfully?
      value: |
        - [ ] The activity appears in the activities list on the website.
        - [ ] The activity description, schedule, and participant limit are displayed correctly.
        - [ ] Students can sign up for the activity (up to the maximum number of participants).
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information about this activity (e.g., room number, supervising teacher, special requirements).
      placeholder: "Optional: add any extra details here."
