name: Update Existing Activity
description: Request changes to an existing extracurricular activity (description, schedule, participant limit, etc.).
title: "Update activity: [Activity Name]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request changes to an existing activity. Please fill in all fields that need to be changed. Leave fields blank if they should stay the same.

  - type: input
    id: activity-name
    attributes:
      label: Activity Name
      description: The exact name of the activity you want to update (as shown on the website).
      placeholder: "e.g., Chess Club"
    validations:
      required: true

  - type: textarea
    id: new-description
    attributes:
      label: New Description (leave blank to keep current)
      description: The updated description for this activity.
      placeholder: "e.g., Learn advanced chess strategies and compete in regional tournaments."

  - type: input
    id: new-schedule
    attributes:
      label: New Schedule — human-readable (leave blank to keep current)
      description: The updated schedule as it should appear on the activity card.
      placeholder: "e.g., Mondays and Wednesdays, 3:15 PM - 4:45 PM"

  - type: dropdown
    id: new-days
    attributes:
      label: New Days of the Week (leave unselected to keep current)
      description: Select all days when this activity will now meet. Only fill this in if the days are changing.
      multiple: true
      options:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday

  - type: input
    id: new-start-time
    attributes:
      label: New Start Time in 24-hour format (leave blank to keep current)
      description: Updated start time in HH:MM format (24-hour clock).
      placeholder: "e.g., 15:15"

  - type: input
    id: new-end-time
    attributes:
      label: New End Time in 24-hour format (leave blank to keep current)
      description: Updated end time in HH:MM format (24-hour clock).
      placeholder: "e.g., 17:00"

  - type: input
    id: new-max-participants
    attributes:
      label: New Maximum Number of Participants (leave blank to keep current)
      description: The updated maximum number of students allowed to sign up.
      placeholder: "e.g., 25"

  - type: textarea
    id: reason
    attributes:
      label: Reason for Change
      description: Why does this activity need to be updated?
      placeholder: "e.g., The room changed, so the schedule needs to move 15 minutes later."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this update has been completed successfully?
      value: |
        - [ ] The activity card shows the updated information on the website.
        - [ ] All other details for the activity remain unchanged.
    validations:
      required: true
